<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Quest | Sanketika Fest × Datanova</title>
    <meta name="description" content="Campus Breakout — A mystery quest event by Datanova Club at Sanketika Fest">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>
    <canvas id="hero-canvas"></canvas>
    
    <header class="site-header">
        <div class="header-inner">
            <div class="header-brand">
                <img src="{{ url_for('static', filename='Asscets/datanova.jpeg') }}" alt="Datanova Club" class="header-logo">
            </div>
            <nav class="header-nav">
                <a href="{{ url_for('index') }}">HOME</a>
                <a href="#">EVENTS</a>
                <a href="{{ url_for('leaderboard') }}">LEADERBOARD</a>
                <a href="#">ABOUT</a>
            </nav>
            <div class="header-admin">
                <a href="{{ url_for('admin_login') }}" class="admin-link">[ADMIN LOGIN]</a>
            </div>
        </div>
    </header>

    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages" role="alert" aria-live="polite">
            {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    <footer class="site-footer">
        <div class="footer-text"><span>Sanketika Fest 2026</span> · Datanova Club · Lords Institute of Engineering &amp; Technology</div>
        <div class="footer-logos">
            <img src="{{ url_for('static', filename='Asscets/sanketika.jpeg') }}" alt="Sanketika Fest" class="footer-logo">
            <img src="{{ url_for('static', filename='Asscets/datanova.jpeg') }}" alt="Datanova Club" class="footer-logo">
        </div>
    </footer>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
