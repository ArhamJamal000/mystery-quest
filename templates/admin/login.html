{% extends 'base.html' %}
{% block content %}
<main class="card admin-card">
    <header style="margin-bottom: var(--sp-6);">
        <h1 style="color: var(--text-primary); font-size: 2rem;">🔐 ADMIN ACCESS</h1>
    </header>
    <section>
        <form action="{{ url_for('admin_login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="margin-bottom: var(--sp-6);">
                <label for="password">Admin Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; border-radius: 4px;">Login</button>
        </form>
        <p class="muted" style="font-size: 0.8rem; margin-top: var(--sp-4);">5 attempts max. Lockout: 10 minutes.</p>
    </section>
</main>
{% endblock %}
